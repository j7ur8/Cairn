# Fixed deployment config. Contains startup-level, sensitive, and infrastructure settings.
# The UI does not edit this file; changes usually require restarting server and dispatcher.
app:
  public_url: http://cairn-server:8000
  log:
    level: INFO
    format: text
  retention:
    enabled: true
    interval_seconds: 21600
database:
  url: postgresql+psycopg://cairn:cairn@cairn-postgres:5432/cairn
  pool_size: 5
  max_overflow: 10
  pool_timeout: 30
security:
  jwt_secret: change-me-generate-with-python-secrets-token-urlsafe-48
  dispatcher_api_token: change-me-service-jwt-signed-with-jwt-secret
admin:
  email: admin@example.com
  password: change-me-on-first-login
dispatcher:
  health_addr: 0.0.0.0:9100
  reload_url: http://cairn-dispatcher:9100/reload
  reload_enabled: true
storage:
  host_root: ${CAIRN_HOST_ROOT}/datas
  server_mount: /cairn/datas
  worker_workspace: /home/kali/workspace
worker:
  completed_action: stop
  stopped_action: remove
  cloak_sidecar:
    image: cairn-cloak-browser:js-reverse
    slots: 2
    novnc:
      enabled: true
      host: 127.0.0.1
    profile_root: ${CAIRN_HOST_ROOT}/datas/cloak-profiles
runner:
  image: cairn-llm-runner:latest
  user: kali
  exec_user: kali
  network_mode: cairn
  cap_add: []
  extra_mounts: []
  resources:
    mem_limit: 2g
    pids_limit: 512
    nano_cpus: null
tool_sidecars:
  kali:
    image: cairn-kali-tools:latest
    network_mode: cairn
    enabled: true
    user: kali
    exec_user: kali
    cap_add:
    - NET_RAW
    - NET_ADMIN
    extra_mounts: []
    resources:
      mem_limit: null
      pids_limit: null
      nano_cpus: null
  metasploit:
    image: cairn-metasploit-tools:latest
    network_mode: cairn
    enabled: true
    user: kali
    exec_user: kali
    cap_add: []
    extra_mounts: []
    resources:
      mem_limit: null
      pids_limit: null
      nano_cpus: null
