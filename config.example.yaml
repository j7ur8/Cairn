# Runtime dispatch config. Contains settings that may be adjusted through the UI.
# Saving this file through the UI can trigger a dispatcher reload.
server:
  log:
    level: INFO
    format: text
  retention:
    enabled: true
    interval_seconds: 21600
  settings:
    intent_timeout: 90
    reason_timeout: 300
dispatcher:
  runtime:
    interval: 3
    max_workers: 8
    max_running_projects: 3
    max_project_workers: 2
    healthcheck_timeout: 20
tasks:
  bootstrap:
    timeout: 300
    conclude_timeout: 120
  reason:
    timeout: 300
    max_intents: 2
  explore:
    timeout: 900
    conclude_timeout: 180
observability:
  enabled: true
  record:
  - prompts
  - stdout
  - stderr
  record_raw_worker_stream: false
  max_event_bytes: 16384
  max_bytes_per_execution: 10485760
  flush_interval_ms: 250
  flush_max_bytes: 8192
  retention_days: 14
  redaction_patterns: []
worker_pool:
  workers:
  - name: claudecode_deepseek-v4-pro
    type: claudecode
    task_types:
    - bootstrap
    - reason
    - explore
    max_running: 6
    priority: 1
    model_reasoning_effort: high
    models:
    - deepseek-v4-pro
    - deepseek-v4-flash
    env:
      ANTHROPIC_MODEL: deepseek-v4-pro
      ANTHROPIC_BASE_URL: https://api.deepseek.com/anthropic
      ANTHROPIC_AUTH_TOKEN: sk-REPLACE-ME
  - name: codex
    type: codex
    task_types:
    - bootstrap
    - reason
    - explore
    max_running: 2
    priority: 0
    model_reasoning_effort: high
    models:
    - gpt-5.4-mini
    - gpt-5.4
    - gpt-5.5
    env:
      CODEX_MODEL: gpt-5.4
      CODEX_BASE_URL: https://seuapi.20250731.xyz
      OPENAI_API_KEY: sk-REPLACE-ME
