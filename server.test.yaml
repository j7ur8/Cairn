app:
  public_url: http://cairn-server:8000
  log:
    level: INFO
    format: text
  retention:
    enabled: false
    interval_seconds: 21600
database:
  url: postgresql+psycopg://cairn:cairn@localhost:5432/cairn
  pool_size: 5
  max_overflow: 10
  pool_timeout: 30
security:
  jwt_secret: test-jwt-secret-do-not-use-in-prod-32bytes
  dispatcher_api_token: test-dispatcher-token
admin:
  email: ''
  password: ''
dispatcher:
  health_addr: 127.0.0.1:9100
  reload_url: http://127.0.0.1:9100/reload
  reload_enabled: false
storage:
  host_root: /tmp/cairn-test
  server_mount: /tmp/cairn-test
  worker_workspace: /home/kali/workspace
worker:
  image: cairn-worker-container:mcp-camoufox
  container_user: 0:0
  exec_user: kali
  network: cairn
  completed_action: stop
  stopped_action: remove
  cap_add: []
  extra_mounts: []
  resources:
    mem_limit: null
    pids_limit: null
    nano_cpus: null
