services:
  cairn-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: cairn-app
    container_name: cairn-server
    ports:
      - "8000:8000"
    environment:
      CAIRN_ATTACHMENTS_ROOT: /Users/jmac/Documents/GitHub/Cairn/datas/attachments
      CAIRN_PROJECT_FILES_ROOT: /Users/jmac/Documents/GitHub/Cairn/datas/project-files
      CAIRN_WORKER_ATTACHMENTS_ROOT: /mnt/attachments
    volumes:
      - ./datas/cairn/:/root/.local/share/cairn/
      - ./datas:/Users/jmac/Documents/GitHub/Cairn/datas
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/projects', timeout=5)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 3s
    restart: unless-stopped
    networks:
      - cairn
    command: ["uv", "run", "cairn", "serve", "--host", "0.0.0.0", "--no-access-log"]
  cairn-dispatcher:
    build:
      context: .
      dockerfile: Dockerfile
    image: cairn-app
    container_name: cairn-dispatcher
    # Pull ${ENV_VAR} substitutions (DEEPSEEK_AUTH_TOKEN, etc.) from the
    # project-root .env file. The file must NEVER be committed; see
    # .gitignore and .dockerignore. SSH defaults in dispatch.yaml use
    # ${VAR:-} so the dispatcher still starts when these are unset.
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./dispatch.yaml:/cairn/dispatch.yaml
      - ./capabilities:/cairn/capabilities:ro
      - ./datas:/Users/jmac/Documents/GitHub/Cairn/datas
    depends_on:
      cairn-server:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cairn
    command: ["uv", "run", "cairn", "dispatch", "--config", "dispatch.yaml"]

networks:
  cairn:
    name: cairn
    driver: bridge
