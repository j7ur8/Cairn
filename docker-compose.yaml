services:
  cairn-postgres:
    image: postgres:16-alpine
    container_name: cairn-postgres
    environment:
      POSTGRES_DB: cairn
      POSTGRES_USER: cairn
      POSTGRES_PASSWORD: cairn
    ports:
      - "5432:5432"
    volumes:
      - cairn-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cairn -d cairn"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped
    networks:
      - cairn

  cairn-worker-image:
    build:
      context: ./container
      dockerfile: Dockerfile
    image: cairn-worker-container:mcp-camoufox
    container_name: cairn-worker-image
    command: ["true"]
    restart: "no"
    network_mode: "none"
  cairn-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: cairn-app
    container_name: cairn-server
    ports:
      - "8000:8000"
    # ${PWD} resolves to the directory containing this docker-compose.yaml.
    # Both the server and the dispatcher need to agree on the same host
    # path so the server can list files written by worker bind mounts.
    #
    # env_file: shares CAIRN_JWT_SECRET and the optional
    # CAIRN_INITIAL_ADMIN_* with the dispatcher. Both containers must
    # agree on the same secret; otherwise the dispatcher's API token
    # would be rejected with 401 by the server.
    env_file:
      - .env
    environment:
      CAIRN_DATABASE_URL: ${CAIRN_DATABASE_URL:-postgresql+psycopg://cairn:cairn@cairn-postgres:5432/cairn}
      CAIRN_ATTACHMENTS_ROOT: ${PWD}/datas/attachments
      CAIRN_PROJECT_FILES_ROOT: ${PWD}/datas/project-files
      CAIRN_WORKER_ATTACHMENTS_ROOT: /mnt/attachments
      CAIRN_DISPATCH_CONFIG_PATH: /cairn/dispatch.yaml
      CAIRN_CAPABILITIES_CONFIG_PATH: /cairn/dispatch.capabilities.yaml
      CAIRN_DISPATCHER_RELOAD_URL: http://cairn-dispatcher:9100/reload
    volumes:
      - ${PWD}/datas:${PWD}/datas
      - ./dispatch.yaml:/cairn/dispatch.yaml
      - ./dispatch.capabilities.yaml:/cairn/dispatch.capabilities.yaml
    depends_on:
      cairn-postgres:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 3s
    restart: unless-stopped
    networks:
      - cairn
    command: ["uv", "run", "cairn", "serve", "--host", "0.0.0.0", "--no-access-log"]
  cairn-dispatcher:
    build:
      context: .
      dockerfile: Dockerfile
    image: cairn-app
    container_name: cairn-dispatcher
    # Pull ${ENV_VAR} substitutions (DEEPSEEK_AUTH_TOKEN, etc.) from the
    # project-root .env file. The file must NEVER be committed; see
    # .gitignore and .dockerignore. SSH defaults in dispatch.yaml use
    # ${VAR:-} so the dispatcher still starts when these are unset.
    #
    # CAIRN_DISPATCHER_DATAS_ROOT is the *host* path to the shared datas
    # directory. dispatch.yaml uses it in bind_mounts[*].host_path so the
    # Docker daemon can actually resolve the bind mount (the dispatcher
    # itself runs in a container, so a path relative to dispatch.yaml
    # would resolve to the image's baked-in datas, which is invisible to
    # the host's Docker daemon).
    env_file:
      - .env
    environment:
      CAIRN_DATABASE_URL: ${CAIRN_DATABASE_URL:-postgresql+psycopg://cairn:cairn@cairn-postgres:5432/cairn}
      # Hardcoded absolute path; the value lives in .env so a
      # different host can override without editing this file.
      CAIRN_DISPATCHER_DATAS_ROOT: ${CAIRN_DISPATCHER_DATAS_ROOT}
      CAIRN_DISPATCHER_HEALTH_ADDR: 0.0.0.0:9100
      UV_CACHE_DIR: /tmp/uv-cache
      XDG_CACHE_HOME: /tmp/.cache
    # SECURITY: the dispatcher still needs the Docker socket to launch
    # worker containers; no-new-privileges and a read-only root fs reduce
    # blast radius but do not make docker.sock safe against RCE.
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./dispatch.yaml:/cairn/dispatch.yaml
      - ./dispatch.capabilities.yaml:/cairn/dispatch.capabilities.yaml:ro
      - ./capabilities:/cairn/capabilities:ro
      - ${PWD}/datas:${PWD}/datas
    depends_on:
      cairn-postgres:
        condition: service_healthy
      cairn-server:
        condition: service_healthy
      cairn-worker-image:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9100/healthz', timeout=5)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 3s
    networks:
      - cairn
    command: ["/cairn/.venv/bin/cairn", "dispatch", "--config", "dispatch.yaml"]

networks:
  cairn:
    name: cairn
    driver: bridge

volumes:
  cairn-postgres-data:
