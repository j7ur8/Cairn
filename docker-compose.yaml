services:
  cairn-postgres:
    image: postgres:16-alpine
    container_name: cairn-postgres
    environment:
      POSTGRES_DB: cairn
      POSTGRES_USER: cairn
      POSTGRES_PASSWORD: cairn
    ports:
      - "5432:5432"
    volumes:
      - cairn-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cairn -d cairn"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped
    mem_limit: 512m
    networks:
      - cairn

  cairn-worker-image:
    build:
      context: ./container
      dockerfile: Dockerfile
    image: cairn-worker-container:mcp-camoufox
    container_name: cairn-worker-image
    command: ["true"]
    restart: "no"
    network_mode: "none"
  cairn-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: cairn-app
    container_name: cairn-server
    ports:
      - "8000:8000"
    volumes:
      - ${CAIRN_DATA_DIR:-./datas}:/cairn/datas
      - ./server.yaml:/cairn/server.yaml
      - ./config.yaml:/cairn/config.yaml
      - ./config.resources.yaml:/cairn/config.resources.yaml
    depends_on:
      cairn-postgres:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 3s
    restart: unless-stopped
    mem_limit: 512m
    networks:
      - cairn
    command: ["uv", "run", "cairn", "serve", "--host", "0.0.0.0", "--no-access-log"]
  cairn-dispatcher:
    build:
      context: .
      dockerfile: Dockerfile
    image: cairn-app
    container_name: cairn-dispatcher
    environment:
      UV_CACHE_DIR: /tmp/uv-cache
      XDG_CACHE_HOME: /tmp/.cache
    # SECURITY: the dispatcher still needs the Docker socket to launch
    # worker containers; no-new-privileges and a read-only root fs reduce
    # blast radius but do not make docker.sock safe against RCE.
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./server.yaml:/cairn/server.yaml:ro
      - ./config.yaml:/cairn/config.yaml
      - ./config.resources.yaml:/cairn/config.resources.yaml:ro
      - ./capabilities:/cairn/capabilities:ro
      - ${CAIRN_DATA_DIR:-./datas}:/cairn/datas
    depends_on:
      cairn-postgres:
        condition: service_healthy
      cairn-server:
        condition: service_healthy
      cairn-worker-image:
        condition: service_completed_successfully
    restart: unless-stopped
    mem_limit: 512m
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9100/healthz', timeout=5)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 3s
    networks:
      - cairn
    command: ["/cairn/.venv/bin/cairn", "dispatch", "--config", "config.yaml"]

networks:
  cairn:
    name: cairn
    driver: bridge

volumes:
  cairn-postgres-data:
