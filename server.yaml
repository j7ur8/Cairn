app:
  public_url: http://cairn-server:8000
  log:
    level: INFO
    format: text
  retention:
    enabled: true
    interval_seconds: 21600
database:
  url: postgresql+psycopg://cairn:cairn@cairn-postgres:5432/cairn
  pool_size: 5
  max_overflow: 10
  pool_timeout: 30
security:
  jwt_secret: Dk-YXm4TySPofrMNVxbbLASnMBdtXWwyHRAR7NEqmW12OwfOXfpRiggJz3ILXK8f
  dispatcher_api_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJkaXNwYXRjaGVyIiwiaWF0IjoxNzgwNzQzMDg3LCJuYmYiOjE3ODA3NDMwODcsImV4cCI6MTgxMjI3OTA4NywianRpIjoiMmI1NDhlMWYyY2ViNGJiZmI1Mzk5ZGFiZGRiY2I2ZGUiLCJyb2xlIjoic2VydmljZSJ9.y1x_9yApeftba28q_hckY8lSjcHqhbKKJKcYkGLo0FQ
admin:
  email: admin@123.com
  password: Aa123123
dispatcher:
  health_addr: 0.0.0.0:9100
  reload_url: http://cairn-dispatcher:9100/reload
  reload_enabled: true
storage:
  host_root: ${CAIRN_HOST_ROOT}/datas
  server_mount: /cairn/datas
  worker_workspace: /home/kali/workspace
worker:
  completed_action: stop
  stopped_action: stop
  cloak_sidecar:
    image: cairn-cloak-browser:js-reverse
    slots: 2
    novnc:
      enabled: true
      host: 127.0.0.1
    profile_root: ${CAIRN_HOST_ROOT}/datas/cloak-profiles
runner:
  image: cairn-llm-runner:latest
  user: kali
  exec_user: kali
  network_mode: cairn
  cap_add: []
  extra_mounts: []
  resources:
    mem_limit: 2g
    pids_limit: 512
    nano_cpus: null
tool_sidecars:
  kali:
    image: cairn-kali-tools:latest
    network_mode: cairn
    enabled: true
    user: kali
    exec_user: kali
    cap_add:
    - NET_RAW
    - NET_ADMIN
    extra_mounts: []
    resources:
      mem_limit: null
      pids_limit: null
      nano_cpus: null
  metasploit:
    image: cairn-metasploit-tools:latest
    network_mode: cairn
    enabled: true
    user: kali
    exec_user: kali
    cap_add: []
    extra_mounts: []
    resources:
      mem_limit: null
      pids_limit: null
      nano_cpus: null
