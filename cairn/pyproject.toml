[project]
name = "cairn"
version = "0.2.1"
description = "Fact-graph based collaborative exploration protocol"
authors = [
    { name = "leixiao", email = "1729888211@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "click>=8.1",
    "pyyaml>=6.0",
    "docker>=7.1.0",
    "requests>=2.32.3",
    "python-multipart>=0.0.20",
    "pyjwt>=2.8",
    "bcrypt>=4.0",
    "cryptography>=42.0",
    "prometheus-client>=0.20",
    "tenacity>=8.2",
    "pydantic[email]>=2.7",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
]

[project.scripts]
cairn = "cairn.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cairn"]

[dependency-groups]
dev = [
    "httpx>=0.27",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple"
default = true
