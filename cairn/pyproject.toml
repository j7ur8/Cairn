[project]
name = "cairn"
version = "0.2.1"
description = "Fact-graph based collaborative exploration protocol"
authors = [
    { name = "leixiao", email = "1729888211@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "click>=8.1",
    "pyyaml>=6.0",
    "docker>=7.1.0",
    "requests>=2.32.3",
    "python-multipart>=0.0.20",
    "pyjwt>=2.8",
    "bcrypt>=4.0",
    "cryptography>=42.0",
    "prometheus-client>=0.20",
    "tenacity>=8.2",
    "pydantic[email]>=2.7",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
]

[project.scripts]
cairn = "cairn.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cairn"]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = [
    "db: PostgreSQL integration tests",
]

[tool.ruff]
# Match the existing code style. The dispatcher and server modules use
# wide log lines, so a hard line-length cap would produce noise without
# improving anything; E501 is disabled below rather than reflowing logs.
line-length = 120
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
# Conservative baseline so the gate is green on day one: pyflakes (F),
# a subset of pycodestyle (E/W), isort (I), bugbear (B), pyupgrade (UP),
# comprehensions (C4). Tighten incrementally rather than reflowing the
# whole tree at once.
select = ["F", "E", "W", "I", "B", "UP", "C4"]
ignore = [
    "E501",   # line length: log statements are intentionally long
    "B008",   # function call in default arg: FastAPI Depends() idiom
    "B017",   # tests intentionally assert broad Exception in a few places
]

[tool.ruff.lint.per-file-ignores]
# Tests favor readability over import hygiene (sys.path shims at top).
"tests/*" = ["E402"]
# Package __init__ files are re-export aggregators; the "unused" imports
# are the public surface of the package, not dead code.
"**/__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.12"
# The annotated surface is fully clean and enforced as a blocking CI gate
# (see .github/workflows/ci.yml). Keep it at zero: any new type error fails
# the build. check_untyped_defs is on so unannotated function bodies are not
# a blind spot; warn_unused_ignores keeps the # type: ignore set honest.
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
exclude = ["migrations/", "tests/"]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple"
default = true
