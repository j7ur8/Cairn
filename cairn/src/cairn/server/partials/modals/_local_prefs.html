<!-- Local Preferences -->
<div x-show="showLocalPrefs" x-cloak class="fixed inset-0 z-50 flex items-center justify-center overlay" @click.self="showLocalPrefs = false">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-6 border border-slate-200/60" @click.stop>
    <h3 class="text-base font-semibold text-slate-700 mb-4">Local Preferences</h3>
    <div class="space-y-4">
      <div>
        <label class="text-[11px] text-slate-400 mb-1 block font-medium">Actor</label>
        <input x-model="localPrefs.actor_name" placeholder="Your name" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-100 focus:border-brand-400 transition placeholder:text-slate-300">
      </div>
      <div>
        <label class="text-[11px] text-slate-400 mb-1 block font-medium">Default layout</label>
        <select x-model="localPrefs.layout_mode" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm bg-white focus:outline-none focus:ring-2 focus:ring-brand-100 focus:border-brand-400 transition">
          <option value="dagre_tb">Dagre ↓</option>
          <option value="dagre_lr">Dagre →</option>
          <option value="klay_tb">Klay ↓</option>
          <option value="klay_lr">Klay →</option>
          <option value="elk_tb">ELK ↓</option>
          <option value="elk_lr">ELK →</option>
        </select>
      </div>
      <p class="text-[11px] text-slate-400">Stored only in this browser.</p>
    </div>
    <div class="flex justify-end gap-2 mt-5">
      <button @click="showLocalPrefs = false" class="px-4 py-2 text-sm text-slate-500 hover:bg-slate-50 rounded-xl transition">Close</button>
      <button @click="saveLocalSettings()" class="px-4 py-2 text-sm bg-slate-800 text-white rounded-xl font-medium hover:bg-slate-900 transition shadow-sm">Save Local</button>
    </div>
  </div>
</div>
