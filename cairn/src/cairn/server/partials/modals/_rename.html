<!-- Rename Project -->
<div x-show="showRenameModal" x-cloak class="fixed inset-0 z-50 flex items-center justify-center overlay" @click.self="showRenameModal = false">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg p-6 border border-slate-200/60" @click.stop>
    <h3 class="text-base font-semibold text-slate-700 mb-1">Rename Project</h3>
    <p class="text-xs text-slate-400 mb-4" x-text="projectLabel(renameForm.projectId, renameForm.originalTitle)"></p>
    <div class="space-y-3">
      <input x-ref="renameTitleInput" x-model="renameForm.title" @keydown.enter.prevent="renameProject()" placeholder="Project title" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-100 focus:border-brand-400 transition placeholder:text-slate-300">
      <p class="text-[11px] text-slate-400">This only changes the project title and is allowed in any project status.</p>
    </div>
    <div class="flex justify-end gap-2 mt-5">
      <button @click="showRenameModal = false" class="px-4 py-2 text-sm text-slate-500 hover:bg-slate-50 rounded-xl transition">Cancel</button>
      <button data-testid="rename-submit" @click="renameProject()" :disabled="!renameForm.projectId || !renameForm.title"
        class="px-5 py-2 text-sm bg-slate-800 text-white rounded-xl font-medium hover:bg-slate-900 transition disabled:opacity-30 shadow-sm">Save</button>
    </div>
  </div>
</div>
