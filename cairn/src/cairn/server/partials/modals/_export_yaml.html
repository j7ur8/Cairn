<!-- Export Preview -->
<div x-show="showYamlModal" x-cloak class="fixed inset-0 z-50 flex items-center justify-center overlay" @click.self="showYamlModal = false">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-4xl mx-4 border border-slate-200/60 overflow-hidden" @click.stop>
    <div class="px-5 py-4 border-b border-slate-200/80 flex items-center justify-between gap-4">
      <div class="min-w-0 flex items-center gap-3">
        <div class="flex rounded-lg border border-slate-200 overflow-hidden shrink-0">
          <button @click="switchExportTab('yaml')" class="px-2.5 py-1 text-xs font-medium transition"
            :class="exportTab === 'yaml' ? 'bg-slate-100 text-slate-700' : 'text-slate-400 hover:text-slate-600'">YAML</button>
          <button @click="switchExportTab('timeline')" class="px-2.5 py-1 text-xs font-medium transition"
            :class="exportTab === 'timeline' ? 'bg-slate-100 text-slate-700' : 'text-slate-400 hover:text-slate-600'">Timeline</button>
        </div>
        <p class="text-xs text-slate-400 truncate" x-text="yamlPreviewTitle"></p>
      </div>
      <div class="flex items-center gap-2">
        <button data-testid="export-copy" @click="copyYamlPreview()" class="px-3 py-1.5 text-sm text-slate-500 hover:bg-slate-50 rounded-xl transition">Copy</button>
        <button @click="showYamlModal = false" class="px-3 py-1.5 text-sm text-slate-500 hover:bg-slate-50 rounded-xl transition">Close</button>
      </div>
    </div>
    <div class="max-h-[75vh] overflow-auto bg-slate-50 p-4">
      <div class="rounded-xl border border-slate-200 bg-white overflow-auto shadow-sm">
        <div class="min-w-max p-0 text-[12px] leading-6 font-mono select-text" x-html="yamlPreviewHtml"></div>
      </div>
    </div>
  </div>
</div>
