<!-- Login overlay: shown when no valid token is in localStorage. -->
<div x-show="showLogin" x-cloak class="fixed inset-0 z-40 flex items-center justify-center bg-slate-900/70 backdrop-blur-sm">
  <form @submit.prevent="loginForm.busy || (loginForm.busy = true, login(loginForm.email, loginForm.password).catch(e => { loginForm.error = e.message || 'login failed'; }).finally(() => { loginForm.busy = false; }))"
        class="w-[360px] max-w-[92vw] bg-white dark:bg-slate-900 rounded-xl shadow-2xl border border-slate-200 dark:border-slate-700 p-6 space-y-4">
    <div class="space-y-1">
      <h2 class="text-lg font-semibold text-slate-800 dark:text-slate-100">Sign in to Cairn</h2>
      <p class="text-xs text-slate-500 dark:text-slate-400">Enter the email and password you were provisioned with.</p>
    </div>
    <label class="block text-xs font-medium text-slate-600 dark:text-slate-300">
      Email
      <input data-testid="login-email" type="email" required autocomplete="username"
             x-model="loginForm.email"
             :disabled="loginForm.busy"
             class="mt-1 w-full px-3 py-2 text-sm rounded-md border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-sky-500" />
    </label>
    <label class="block text-xs font-medium text-slate-600 dark:text-slate-300">
      Password
      <input data-testid="login-password" type="password" required autocomplete="current-password"
             x-model="loginForm.password"
             :disabled="loginForm.busy"
             class="mt-1 w-full px-3 py-2 text-sm rounded-md border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-sky-500" />
    </label>
    <div x-show="loginForm.error" x-text="loginForm.error" class="text-xs text-red-600 dark:text-red-400"></div>
    <button data-testid="login-submit" type="submit"
            :disabled="loginForm.busy"
            class="w-full px-3 py-2 text-sm font-medium rounded-md bg-sky-600 text-white hover:bg-sky-700 disabled:opacity-50 disabled:cursor-not-allowed">
      <span x-show="!loginForm.busy">Sign in</span>
      <span x-show="loginForm.busy" x-cloak>Signing in…</span>
    </button>
  </form>
</div>
