
# Cairn server API endpoint.
server: "http://cairn-server:8000"

# Shared environment variables merged into every worker.
common_env: {}
  # TSEC_SERVER_HOST: "10.0.0.44:8000"
  # TSEC_AGENT_TOKEN: "xxx"

runtime:
  # Scheduler tick interval in seconds.
  interval: 3
  # Global concurrency cap across all workers and all projects.
  max_workers: 8
  # Maximum number of projects that may be actively scheduled at the same time.
  max_running_projects: 3
  # Per-project worker cap. Prevents one project from monopolizing the whole dispatcher.
  max_project_workers: 4
  # Healthcheck timeout for each worker process before a task is assigned.
  healthcheck_timeout: 20
  # Prompt set loaded from cairn/src/cairn/dispatcher/prompts/.
  # Use "cypher" for automated CTF / pentest / vuln-research operation.
  prompt_group: "cypher"

tasks:
  bootstrap:
    # Main execution timeout for the initial direct solve attempt.
    timeout: 300
    # Time budget for conclude fallback after the main phase times out or returns unusable output.
    conclude_timeout: 90
  reason:
    # Reason decides whether the goal is met and whether new intents should be proposed.
    timeout: 300
    # Hard cap on how many new intents one reason step may create.
    max_intents: 2
  explore:
    # Main execution timeout for exploring a claimed intent.
    timeout: 300
    # Time budget for conclude fallback used to summarize confirmed findings from the same session.
    conclude_timeout: 90

observability:
  enabled: true
  record_prompts: true
  record_stdout: true
  record_stderr: true
  record_raw_worker_stream: false
  max_event_bytes: 16384
  max_bytes_per_execution: 10485760
  flush_interval_ms: 250
  flush_max_bytes: 8192
  retention_days: 14
  redaction_patterns: []

remote_support:
  enabled: true
  dnslog:
    url: ""
  ssh:
    # Remote SSH support is opt-in. Empty defaults (${VAR:-}) mean "feature
    # disabled" — RemoteSupportConfig.ssh.is_complete stays False and no
    # CAIRN_REMOTE_SSH_* env is injected into workers.
    host: "${CAIRN_REMOTE_SSH_HOST:-}"
    port: 22
    username: "${CAIRN_REMOTE_SSH_USERNAME:-}"
    password: "${CAIRN_REMOTE_SSH_PASSWORD:-}"

capabilities:
  # 能力 catalog 真相源。Dispatcher 启动时会全量 POST 到 Server 的 /capabilities/catalog。
  # 本地资源统一放 capabilities/mcp/ 与 capabilities/skills/<id>/，详见 capabilities/README.md。
  mcp_servers:
    - id: "kali-server-mcp"
      name: "Kali Server MCP"
      description: "Kali Linux MCP server exposing authorized Kali tool execution through a local stdio bridge."
      command: "/usr/local/bin/kali-mcp-stdio"
      args: []
      env:
        KALI_MCP_TIMEOUT: "300"
      task_types: ["bootstrap", "explore", "reason"]
    - id: "metasploit-mcp"
      name: "Metasploit MCP"
      description: "Metasploit Framework MCP server for module search, session handling, and RPC-backed framework operations."
      command: "/usr/local/bin/metasploit-mcp-stdio"
      args: []
      env:
        MSF_MCP_TRANSPORT: "stdio"
        MSF_AUTO_START_RPC: "true"
        MSF_API_TYPE: "messagepack"
        MSF_API_SSL: "true"
      task_types: ["explore", "reason"]
  # 示例 MCP（需要时取消注释，并把文件放入 capabilities/mcp/<id>/）：
  # mcp_servers:
  #   - id: "example-mcp"
  #     name: "Example MCP"
  #     command: "python3"
  #     args: ["{capability_root}/mcp/example-mcp/server.py", "--stdio"]
  #     env: {}
  #     source_path: "./capabilities/mcp/example-mcp"
  #     task_types: ["bootstrap", "explore", "reason"]
  skills:
    - id: "cypher-ctf"
      name: "Cypher CTF"
      description: "CTF automation workflows for web, pwn, reverse, crypto, forensics, stego and misc tasks."
      source_path: "./capabilities/skills/cypher-ctf"
      task_types: ["bootstrap", "explore", "reason"]
    - id: "cypher-pentest"
      name: "Cypher Pentest"
      description: "Scope-bound authorized penetration testing workflows, evidence capture, cleanup and reporting."
      source_path: "./capabilities/skills/cypher-pentest"
      task_types: ["bootstrap", "explore", "reason"]
    - id: "cypher-vuln-research"
      name: "Cypher Vulnerability Research"
      description: "Source audit, CVE reproduction, PoC adaptation, fuzzing and root-cause analysis workflows."
      source_path: "./capabilities/skills/cypher-vuln-research"
      task_types: ["bootstrap", "explore", "reason"]

roles:
  # 角色 catalog 真相源。Dispatcher 启动时会全量 POST 到 Server 的 /roles/catalog。
  # 创建项目时 UI 可选一个 primary role；项目保存的是 role prompt 快照。
  - id: "cypher-ctf-operator"
    name: "Cypher CTF Operator"
    description: "Fast CTF / cyber-range operator focused on flags, shells, proofs, and reproducible exploit paths."
    source_path: "./capabilities/roles/cypher-ctf-operator/ROLE.md"
    task_types: ["bootstrap", "explore", "reason"]
  - id: "cypher-pentest-operator"
    name: "Cypher Pentest Operator"
    description: "Authorized pentest operator focused on scope, evidence, impact validation, cleanup, and reporting."
    source_path: "./capabilities/roles/cypher-pentest-operator/ROLE.md"
    task_types: ["bootstrap", "explore", "reason"]
  - id: "cypher-vuln-researcher"
    name: "Cypher Vulnerability Researcher"
    description: "Vulnerability researcher focused on root cause, reproducible PoC, exploitability, and fixes."
    source_path: "./capabilities/roles/cypher-vuln-researcher/ROLE.md"
    task_types: ["bootstrap", "explore", "reason"]

container:
  # Base worker container. The dispatcher execs agent commands inside one container per project.
  image: "ghcr.io/oritera/cairn-worker-container:latest"
  # Worker process UID:GID, passed straight through to docker.containers.run(user=...).
  # On macOS Docker Desktop, bind mounts go through VirtioFS which only honours
  # write syscalls from root (UID 0) regardless of file mode or owner UID — verified
  # with a real `docker run` probe. Uncomment the next line to run the worker as
  # root so /mnt/project becomes writable. On Linux Docker Engine the UID
  # namespace is shared 1:1 with the host, so this is optional.
  user: "0:0"
  # Project worker containers join the shared Docker network used by Cairn services.
  # The docker-compose stack creates this network automatically. When running manually,
  # create it first with: docker network create cairn
  network_mode: "cairn"
  # "stop" keeps finished containers for inspection; "remove" is cleaner but loses post-run state.
  completed_action: "stop"
  # Auto-destroy worker containers when a project is stopped.
  stopped_action: "remove"
  # Add Linux capabilities only when a task truly needs them, such as packet crafting or network admin actions.
  # cap_add:
  #   - "NET_RAW"
  #   - "NET_ADMIN"
  # Optional host folder sharing for CTF attachments, source trees, large outputs, or project-local workspaces.
  # Use {project_id} to isolate writable folders per Cairn project.
  # Tell the agent about the mounted path through the project origin or hints, e.g.
  # "Attachment source code is mounted at /mnt/attachments/web-src."
  bind_mounts:
    - name: "ctf-attachments"
      host_path: "./datas/attachments"
      container_path: "/mnt/attachments"
      read_only: true
    - name: "project-files"
      host_path: "./datas/project-files/{project_id}"
      container_path: "/mnt/project"
      read_only: false


workers:
  # Worker priority is ascending: lower numbers are preferred first.
  # max_running is per-worker concurrency. Slower backends such as Pi usually benefit from lower values.
  - name: "claudecode_deepseek-v4-pro"
    type: "claudecode"
    task_types: [bootstrap, reason, explore]
    max_running: 6
    priority: 1
    env:
      ANTHROPIC_MODEL: "deepseek-v4-pro"
      ANTHROPIC_BASE_URL: "https://api.deepseek.com/anthropic"
      ANTHROPIC_AUTH_TOKEN: "${DEEPSEEK_AUTH_TOKEN}"

