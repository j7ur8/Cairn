remote_support:
  enabled: true
  dnslog:
    url: ''
  ssh:
    host: ''
    port: 22
    username: ''
    password: ''
capabilities:
  mcp_servers:
  - id: kali-server-mcp
    name: Kali Server MCP
    transport: stdio
    description: Kali Linux MCP server exposing authorized Kali tool execution through
      a local stdio bridge.
    command: /usr/local/bin/kali-mcp-stdio
    args: []
    env:
      KALI_MCP_TIMEOUT: '300'
    use_when:
    - Authorized Kali tool execution is required for reconnaissance, scanning, exploitation
      validation, or evidence collection.
    - The current task needs command-line security tools available in the Kali worker
      image.
    - A CTF or pentest workflow has identified a concrete tool-assisted action to
      run.
    activation_hint: Use this MCP only when an actual Kali command needs to run. Follow
      the active task workflow before choosing commands and recording evidence.
    task_types:
    - bootstrap
    - explore
  - id: metasploit-mcp
    name: Metasploit MCP
    transport: stdio
    description: Metasploit Framework MCP server for module search, session handling,
      and RPC-backed framework operations.
    command: /usr/local/bin/metasploit-mcp-stdio
    args: []
    env: {}
    use_when:
    - Metasploit module search, exploit validation, payload handling, session management,
      or post-module execution is required.
    - The target is in authorized scope and the task has a concrete framework-backed
      action to perform.
    - Evidence needs to include module names, payload/options, session state, and
      validation results.
    activation_hint: Use this MCP only inside authorized scope. Before invoking a
      module, state the target, module, payload/options, expected validation, and
      cleanup requirements; follow the active scope, ROE, and reporting workflow.
    task_types:
    - bootstrap
    - explore
  - id: chrome-devtools-host
    name: Host Chrome DevTools MCP
    transport: stdio
    description: Connects to a host-managed Google Chrome instance started with remote
      debugging enabled on port 9222. Requires the host browser to be running before
      Cairn task execution.
    command: chrome-devtools-mcp
    args:
    - --browserUrl=http://host.docker.internal:9222
    probe_config:
      type: chrome_devtools_http
      url: http://host.docker.internal:9222/json/version
    use_when:
    - Browser runtime inspection is required.
    - Chrome DevTools remote debugging is available.
    - Frontend network requests, console output, screenshots, or runtime JavaScript
      evidence are needed.
    activation_hint: Use this MCP for browser navigation, network inspection, console/runtime
      evidence, screenshots, and evaluate_script against the host Chrome session.
    required_skill_ids:
    - js-reverse-automation
    task_types:
    - bootstrap
    - explore
  skills:
  - id: js-reverse-automation
    name: js-reverse-automation
    description: use devtools mcp to reverse js
    source_path: ./capabilities/skills/js-reverse-automation
    use_when:
    - Browser-side JavaScript reverse engineering is needed.
    - sign, enc, token, or nonce generation must be traced.
    - Encrypted API requests need to be reproduced.
    - Runtime hook evidence or Webpack/module cache discovery is needed.
    preferred_mcp_ids:
    - chrome-devtools-host
    activation_hint: When these conditions match, first read this skill's SKILL.md
      and follow its workflow before using the paired browser MCP.
    task_types:
    - bootstrap
    - explore
  - id: ctf-web-js-analysis
    name: CTF Web JS Analysis
    description: Static-first CTF Web JavaScript analysis for visible JS collection,
      source maps/chunks, API extraction, frontend leak discovery, and defensive JS
      boundary identification.
    source_path: ./capabilities/skills/ctf-web-js-analysis
    use_when:
    - A CTF Web challenge needs public frontend JavaScript collection and static analysis.
    - Visible JS bundles, chunks, source maps, manifests, or service workers may reveal
      APIs or parameters.
    - Frontend API endpoints, request parameters, routes, or configuration values
      need to be extracted with evidence.
    - Potential frontend leaks such as tokens, keys, source maps, debug flags, internal
      hosts, or dependency issues need triage.
    - Anti-debug, RuiShu-like, WAF, or bot-defense JavaScript must be identified as
      a boundary before deeper runtime reverse engineering.
    preferred_mcp_ids:
    - chrome-devtools-host
    activation_hint: Read this skill's SKILL.md before JS static analysis. Use chrome-devtools-host
      only for authorized browser runtime request/HAR evidence, and hand off token/signature
      reproduction to js-reverse-automation when needed.
    task_types:
    - bootstrap
    - explore
roles:
- id: cypher-ctf-operator
  name: Cypher CTF Operator
  description: Fast CTF / cyber-range operator focused on flags, shells, proofs, and
    reproducible exploit paths.
  source_path: ./capabilities/roles/cypher-ctf-operator/ROLE.md
  default_skill_ids:
  - ctf-web-js-analysis
  task_types:
  - bootstrap
  - explore
  - reason
- id: cypher-pentest-operator
  name: Cypher Pentest Operator
  description: Authorized pentest operator focused on scope, evidence, impact validation,
    cleanup, and reporting.
  source_path: ./capabilities/roles/cypher-pentest-operator/ROLE.md
  default_skill_ids: []
  task_types:
  - bootstrap
  - explore
  - reason
- id: cypher-vuln-researcher
  name: Cypher Vulnerability Researcher
  description: Vulnerability researcher focused on root cause, reproducible PoC, exploitability,
    and fixes.
  source_path: ./capabilities/roles/cypher-vuln-researcher/ROLE.md
  default_skill_ids: []
  task_types:
  - bootstrap
  - explore
  - reason
