remote_support:
  enabled: true
  dnslog:
    url: ''
  ssh:
    host: ''
    port: 22
    username: ''
    password: ''
capabilities:
  mcp_servers:
  - id: kali-server-mcp
    name: Kali Server MCP
    transport: stdio
    description: Kali Linux MCP server exposing authorized Kali tool execution through
      a local stdio bridge.
    command: /usr/local/bin/kali-mcp-stdio
    args: []
    env:
      KALI_MCP_TIMEOUT: '300'
    use_when:
    - Authorized Kali tool execution is required for reconnaissance, scanning, exploitation
      validation, or evidence collection.
    - The current task needs command-line security tools available in the Kali worker
      image.
    - A CTF or pentest workflow has identified a concrete tool-assisted action to
      run.
    activation_hint: Use this MCP only when an actual Kali command needs to run. If
      cypher-ctf or cypher-pentest is already injected for the task, follow that skill's
      workflow before choosing commands and recording evidence.
    task_types:
    - bootstrap
    - explore
  - id: metasploit-mcp
    name: Metasploit MCP
    transport: stdio
    description: Metasploit Framework MCP server for module search, session handling,
      and RPC-backed framework operations.
    command: /usr/local/bin/metasploit-mcp-stdio
    args: []
    env:
      MSF_MCP_TRANSPORT: stdio
      MSF_AUTO_START_RPC: 'true'
      MSF_API_TYPE: messagepack
      MSF_API_SSL: 'true'
    use_when:
    - Metasploit module search, exploit validation, payload handling, session management,
      or post-module execution is required.
    - The target is in authorized scope and the task has a concrete framework-backed
      action to perform.
    - Evidence needs to include module names, payload/options, session state, and
      validation results.
    activation_hint: Use this MCP only inside authorized scope. Before invoking a
      module, state the target, module, payload/options, expected validation, and
      cleanup requirements; if cypher-pentest is already injected, follow its scope,
      ROE, and reporting workflow.
    task_types:
    - bootstrap
    - explore
  - id: chrome-devtools-host
    name: Host Chrome DevTools MCP
    transport: stdio
    description: Connects to a host-managed Google Chrome instance started with remote
      debugging enabled on port 9222. Requires the host browser to be running before
      Cairn task execution.
    command: chrome-devtools-mcp
    args:
    - --browserUrl=http://host.docker.internal:9222
    probe_config:
      type: chrome_devtools_http
      url: http://host.docker.internal:9222/json/version
    use_when:
    - Browser runtime inspection is required.
    - Chrome DevTools remote debugging is available.
    - Frontend network requests, console output, screenshots, or runtime JavaScript
      evidence are needed.
    activation_hint: Use this MCP for browser navigation, network inspection, console/runtime
      evidence, screenshots, and evaluate_script against the host Chrome session.
    required_skill_ids:
    - js-reverse-automation
    task_types:
    - bootstrap
    - explore
  skills:
  - id: js-reverse-automation
    name: js-reverse-automation
    description: use devtools mcp to reverse js
    source_path: ./capabilities/skills/js-reverse-automation
    use_when:
    - Browser-side JavaScript reverse engineering is needed.
    - sign, enc, token, or nonce generation must be traced.
    - Encrypted API requests need to be reproduced.
    - Runtime hook evidence or Webpack/module cache discovery is needed.
    preferred_mcp_ids:
    - chrome-devtools-host
    activation_hint: When these conditions match, first read this skill's SKILL.md
      and follow its workflow before using the paired browser MCP.
    task_types:
    - bootstrap
    - explore
  - id: cypher-ctf
    name: Cypher CTF
    description: CTF orchestration — triages challenge types and delegates to specialist
      sub-skills (pwn, reverse, crypto, forensics, web).
    source_path: ./capabilities/skills/cypher-ctf
    use_when:
    - The project is a CTF challenge, cyber range, HTB/THM-style box, competition
      sandbox, or flag/proof recovery task.
    - The goal requires a reproducible solve path, exploit script, flag capture, shell
      proof, or final writeup.
    - Challenge triage is needed across web, pwn, reverse, crypto, forensics, blockchain,
      or full-box categories.
    activation_hint: Read this skill's SKILL.md for CTF guidance, classify the challenge
      from current evidence, then read matching bundled specialist guidance under
      skills/<sub-skill-id>/SKILL.md only when its signals fit before deciding whether
      to use Kali, Metasploit, browser, or other tools.
    task_types:
    - bootstrap
    - explore
  - id: cypher-pentest
    name: Cypher Pentest
    description: Pentest orchestration — scope enforcement, vulnerability triage,
      sub-skill delegation, evidence and reporting.
    source_path: ./capabilities/skills/cypher-pentest
    use_when:
    - The project is an authorized penetration test, bug bounty, external attack surface
      assessment, internal network test, or lab pentest.
    - Scope, ROE, evidence capture, impact validation, cleanup, and report-ready findings
      are required.
    - The task involves web/API testing, service exploitation, AD, cloud, container,
      post-exploitation, or vulnerability validation.
    activation_hint: Read this skill's SKILL.md for pentest guidance and enforce scope/ROE
      before any tool action. Read matching local bundled guidance under capabilities/skills/cypher-pentest/skills/<sub-skill-id>/SKILL.md
      only when its signals fit; use Kali or Metasploit MCP only when a concrete tool
      action is needed.
    task_types:
    - bootstrap
    - explore
  - id: cypher-vuln-research
    name: Cypher Vulnerability Research
    description: Vuln research orchestration — source audit, CVE reproduction, PoC
      adaptation, fuzzing and root-cause analysis, sub-skill delegation.
    source_path: ./capabilities/skills/cypher-vuln-research
    task_types:
    - bootstrap
    - explore
roles:
- id: cypher-ctf-operator
  name: Cypher CTF Operator
  description: Fast CTF / cyber-range operator focused on flags, shells, proofs, and
    reproducible exploit paths.
  source_path: ./capabilities/roles/cypher-ctf-operator/ROLE.md
  default_skill_ids:
  - cypher-ctf
  task_types:
  - bootstrap
  - explore
  - reason
- id: cypher-pentest-operator
  name: Cypher Pentest Operator
  description: Authorized pentest operator focused on scope, evidence, impact validation,
    cleanup, and reporting.
  source_path: ./capabilities/roles/cypher-pentest-operator/ROLE.md
  default_skill_ids:
  - cypher-pentest
  task_types:
  - bootstrap
  - explore
  - reason
- id: cypher-vuln-researcher
  name: Cypher Vulnerability Researcher
  description: Vulnerability researcher focused on root cause, reproducible PoC, exploitability,
    and fixes.
  source_path: ./capabilities/roles/cypher-vuln-researcher/ROLE.md
  default_skill_ids:
  - cypher-vuln-research
  task_types:
  - bootstrap
  - explore
  - reason
