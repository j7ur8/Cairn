server:
  base_url: http://127.0.0.1:8000
  database:
    url: postgresql+psycopg://cairn:cairn@localhost:5432/cairn
    pool_size: 5
    max_overflow: 10
    pool_timeout: 30
  auth:
    jwt_secret: test-jwt-secret-do-not-use-in-prod-32bytes
    dispatcher_api_token: test-dispatcher-token
  initial_admin:
    email: ''
    password: ''
  paths:
    datas_root: datas
    attachments_root: datas/attachments
    project_files_root: datas/project-files
    worker_attachments_root: /home/kali/workspace/attachments
  log:
    level: INFO
    format: text
  retention:
    enabled: false
    interval_seconds: 21600
  settings:
    intent_timeout: 90
    reason_timeout: 300
dispatcher:
  health_addr: 127.0.0.1:9100
  reload:
    url: http://127.0.0.1:9100/reload
    enabled: false
  runtime:
    interval: 3
    max_workers: 4
    max_running_projects: 2
    max_project_workers: 4
    healthcheck_timeout: 2
    prompt_group: mock
tasks:
  bootstrap:
    timeout: 9
    conclude_timeout: 5
  reason:
    timeout: 5
    max_intents: 3
  explore:
    timeout: 9
    conclude_timeout: 5
observability:
  enabled: true
  record:
  - prompts
  - stdout
  - stderr
  record_raw_worker_stream: false
  max_event_bytes: 16384
  max_bytes_per_execution: 10485760
  flush_interval_ms: 250
  flush_max_bytes: 8192
  retention_days: 14
  redaction_patterns: []
worker_runtime:
  container:
    image: ghcr.io/oritera/cairn-worker-container:latest
    network_mode: cairn
    completed_action: stop
    stopped_action: remove
    cap_add:
    - NET_RAW
    - NET_ADMIN
  common_env:
    TSEC_BASE_URL: http://<SERVER_HOST>/api
    TSEC_AGENT_TOKEN: common-agent-token
worker_pool:
  proxies: []
  workers:
  - name: mock-observer-1
    type: mock
    task_types:
    - reason
    - explore
    - bootstrap
    max_running: 1
    priority: 0
    env:
      MOCK_HEALTHCHECK: '{"delay":[0,2],"outcomes":{"ok":0.9,"fail":0.1}}'
      MOCK_BOOTSTRAP: '{"delay":[5,10],"outcomes":{"complete":0.0,"fact":0.6,"rejected":0.1,"invalid_json":0.1,"invalid_payload":0.1,"command_fail":0.1}}'
      MOCK_BOOTSTRAP_CONCLUDE: '{"delay":[2,6],"outcomes":{"fact":0.6,"rejected":0.1,"invalid_json":0.1,"invalid_payload":0.1,"command_fail":0.1}}'
      MOCK_REASON: '{"delay":[2,6],"outcomes":{"complete":0.1,"intent":0.4,"noop":0.1,"rejected":0.1,"invalid_json":0.1,"invalid_payload":0.1,"command_fail":0.1}}'
      MOCK_EXPLORE_EXECUTE: '{"delay":[5,10],"outcomes":{"fact":0.6,"rejected":0.1,"invalid_json":0.1,"invalid_payload":0.1,"command_fail":0.1}}'
      MOCK_EXPLORE_CONCLUDE: '{"delay":[2,6],"outcomes":{"fact":0.6,"rejected":0.1,"invalid_json":0.1,"invalid_payload":0.1,"command_fail":0.1}}'
  - name: mock-observer-2
    type: mock
    task_types:
    - reason
    - explore
    - bootstrap
    max_running: 1
    priority: 0
    env:
      MOCK_HEALTHCHECK: '{"delay":[0,2],"outcomes":{"ok":0.9,"fail":0.1}}'
      MOCK_BOOTSTRAP: '{"delay":[5,10],"outcomes":{"complete":0.0,"fact":0.6,"rejected":0.1,"invalid_json":0.1,"invalid_payload":0.1,"command_fail":0.1}}'
      MOCK_BOOTSTRAP_CONCLUDE: '{"delay":[2,6],"outcomes":{"fact":0.6,"rejected":0.1,"invalid_json":0.1,"invalid_payload":0.1,"command_fail":0.1}}'
      MOCK_REASON: '{"delay":[2,6],"outcomes":{"complete":0.1,"intent":0.4,"noop":0.1,"rejected":0.1,"invalid_json":0.1,"invalid_payload":0.1,"command_fail":0.1}}'
      MOCK_EXPLORE_EXECUTE: '{"delay":[5,10],"outcomes":{"fact":0.6,"rejected":0.1,"invalid_json":0.1,"invalid_payload":0.1,"command_fail":0.1}}'
      MOCK_EXPLORE_CONCLUDE: '{"delay":[2,6],"outcomes":{"fact":0.6,"rejected":0.1,"invalid_json":0.1,"invalid_payload":0.1,"command_fail":0.1}}'
